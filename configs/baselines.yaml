# Baselines (no training). Names are pyiqa metric names.
# "trained_on" is recorded so the results table states each model's training data.
data_root: ./datasets
out_dir: results/baselines
datasets:
  koniq10k: {phase: test, batch_size: 16}   # all KonIQ images are 512x384
metrics:
  niqe:       {trained_on: "none (natural-scene statistics)"}
  brisque:    {trained_on: "LIVE (synthetic distortions)"}
  nima:       {trained_on: "AVA (aesthetics)"}
  nima-koniq: {trained_on: "KonIQ-10k"}
  musiq:      {trained_on: "KonIQ-10k"}
  clipiqa:    {trained_on: "none (zero-shot CLIP prompts)"}
